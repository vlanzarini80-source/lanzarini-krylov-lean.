
name: Lean 4 Verification

on:
  push:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Lean 4
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch mathlib dependencies
        run: |
          lake update
          lake exe cache get

      - name: Verify Lean proofs through P74.1
        run: |
          set -euo pipefail

          lake env lean Main.lean
          lake env lean Jacobi2.lean
          lake env lean JacobiGeneral.lean

          LEAN_PATH=".:${LEAN_PATH:-}" lake env lean -o JacobiReal.olean JacobiReal.lean
          LEAN_PATH=".:${LEAN_PATH:-}" lake env lean -o JacobiEvolution.olean JacobiEvolution.lean
          LEAN_PATH=".:${LEAN_PATH:-}" lake env lean -o MatrixExpProbe.olean MatrixExpProbe.lean
          LEAN_PATH=".:${LEAN_PATH:-}" lake env lean -o KrylovNumber.olean KrylovNumber.lean
          LEAN_PATH=".:${LEAN_PATH:-}" lake env lean -o KrylovGram.olean KrylovGram.lean
          LEAN_PATH=".:${LEAN_PATH:-}" lake env lean -o KrylovLagrange.olean KrylovLagrange.lean
          LEAN_PATH=".:${LEAN_PATH:-}" lake env lean -o KrylovGap.olean KrylovGap.lean
          LEAN_PATH=".:${LEAN_PATH:-}" lake env lean -o P73_RealTime.olean P73_RealTime.lean
          LEAN_PATH=".:${LEAN_PATH:-}" lake env lean -o P73_2_State.olean P73_2_State.lean

          LEAN_PATH=".:${LEAN_PATH:-}" lake env lean P74_1_Components.lean | tee p74-1-axioms.log

          if grep -q 'sorryAx' p74-1-axioms.log; then
            echo 'P74.1 FAILED: sorryAx detected'
            exit 1
          fi

          grep -F "'Lanzarini.p74_jacobiState_component_hasDerivAt' depends on axioms:" p74-1-axioms.log
          grep -F "'Lanzarini.p74_jacobiState_parts_hasDerivAt' depends on axioms:" p74-1-axioms.log
