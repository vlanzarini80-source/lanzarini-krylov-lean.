
name: Lean 4 Verification

on:
  push:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Lean 4
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch mathlib dependencies
        run: |
          lake update
          lake exe cache get

      - name: Verify Lean proofs through P77.2
        run: |
          set -euo pipefail

          lake env lean Main.lean
          lake env lean Jacobi2.lean
          lake env lean JacobiGeneral.lean

          LEAN_PATH=".:${LEAN_PATH:-}" lake env lean -o JacobiReal.olean JacobiReal.lean
          LEAN_PATH=".:${LEAN_PATH:-}" lake env lean -o JacobiEvolution.olean JacobiEvolution.lean
          LEAN_PATH=".:${LEAN_PATH:-}" lake env lean -o MatrixExpProbe.olean MatrixExpProbe.lean
          LEAN_PATH=".:${LEAN_PATH:-}" lake env lean -o KrylovNumber.olean KrylovNumber.lean
          LEAN_PATH=".:${LEAN_PATH:-}" lake env lean -o KrylovGram.olean KrylovGram.lean
          LEAN_PATH=".:${LEAN_PATH:-}" lake env lean -o KrylovLagrange.olean KrylovLagrange.lean
          LEAN_PATH=".:${LEAN_PATH:-}" lake env lean -o KrylovGap.olean KrylovGap.lean
          LEAN_PATH=".:${LEAN_PATH:-}" lake env lean -o P73_RealTime.olean P73_RealTime.lean
          LEAN_PATH=".:${LEAN_PATH:-}" lake env lean -o P73_2_State.olean P73_2_State.lean

          LEAN_PATH=".:${LEAN_PATH:-}" lake env lean -o P74_1_Components.olean P74_1_Components.lean | tee p74-1-axioms.log
          LEAN_PATH=".:${LEAN_PATH:-}" lake env lean -o P74_2_KrylovDerivative.olean P74_2_KrylovDerivative.lean | tee p74-2-axioms.log

          LEAN_PATH=".:${LEAN_PATH:-}" lake env lean -o P75_1_Orthogonality.olean P75_1_Orthogonality.lean | tee p75-1-check.log
          LEAN_PATH=".:${LEAN_PATH:-}" lake env lean -o P75_2a_VelocityOrthogonality.olean P75_2a_VelocityOrthogonality.lean | tee p75-2a-check.log
          LEAN_PATH=".:${LEAN_PATH:-}" lake env lean -o P75_2b_CenteredDerivative.olean P75_2b_CenteredDerivative.lean | tee p75-2b-check.log
          LEAN_PATH=".:${LEAN_PATH:-}" lake env lean -o P75_3_QuadraticSpeedBound.olean P75_3_QuadraticSpeedBound.lean | tee p75-3-check.log
          LEAN_PATH=".:${LEAN_PATH:-}" lake env lean -o P75_4_DerivativeSpeedBound.olean P75_4_DerivativeSpeedBound.lean | tee p75-4-check.log

          LEAN_PATH=".:${LEAN_PATH:-}" lake env lean -o P76_1_EnergyVariance.olean P76_1_EnergyVariance.lean | tee p76-1-check.log
          LEAN_PATH=".:${LEAN_PATH:-}" lake env lean -o P76_2_EnergyVarianceIdentity.olean P76_2_EnergyVarianceIdentity.lean | tee p76-2-check.log
          LEAN_PATH=".:${LEAN_PATH:-}" lake env lean -o P76_3_EnergySecondMoment.olean P76_3_EnergySecondMoment.lean | tee p76-3-check.log
          LEAN_PATH=".:${LEAN_PATH:-}" lake env lean -o P76_4_CenteredEnergySpeed.olean P76_4_CenteredEnergySpeed.lean | tee p76-4-check.log
          LEAN_PATH=".:${LEAN_PATH:-}" lake env lean -o P76_5_CenteredVelocity.olean P76_5_CenteredVelocity.lean | tee p76-5-check.log
          LEAN_PATH=".:${LEAN_PATH:-}" lake env lean -o P76_5b_CenteredVelocityNorm.olean P76_5b_CenteredVelocityNorm.lean | tee p76-5b-check.log
          LEAN_PATH=".:${LEAN_PATH:-}" lake env lean -o P76_6_EnergySpeedLimit.olean P76_6_EnergySpeedLimit.lean | tee p76-6-check.log

          LEAN_PATH=".:${LEAN_PATH:-}" lake env lean -o P77_1a_PropagatorCommutes.olean P77_1a_PropagatorCommutes.lean | tee p77-1a-check.log
          LEAN_PATH=".:${LEAN_PATH:-}" lake env lean -o P77_1b_HamiltonianIntertwining.olean P77_1b_HamiltonianIntertwining.lean | tee p77-1b-check.log
          LEAN_PATH=".:${LEAN_PATH:-}" lake env lean -o P77_2_EnergyMeanConservation.olean P77_2_EnergyMeanConservation.lean | tee p77-2-check.log

          if grep -q 'sorryAx' p74-1-axioms.log p74-2-axioms.log p75-1-check.log p75-2a-check.log p75-2b-check.log p75-3-check.log p75-4-check.log p76-1-check.log p76-2-check.log p76-3-check.log p76-4-check.log p76-5-check.log p76-5b-check.log p76-6-check.log p77-1a-check.log p77-1b-check.log p77-2-check.log; then
            echo 'Forbidden sorryAx dependency found' >&2
            exit 1
          fi

          grep -F "'Lanzarini.p74_jacobiState_component_hasDerivAt' depends on axioms:" p74-1-axioms.log
          grep -F "'Lanzarini.p74_jacobiState_parts_hasDerivAt' depends on axioms:" p74-1-axioms.log
          grep -F "'Lanzarini.p74_krylovComplexityAt_hasDerivAt' depends on axioms:" p74-2-axioms.log

          grep -F "'Lanzarini.p75_centeredState_orthogonal' depends on axioms:" p75-1-check.log
          grep -F "'Lanzarini.p75_antiHermitian_real_orthogonal' depends on axioms:" p75-2a-check.log
          grep -F "'Lanzarini.p75_state_velocity_real_orthogonal' depends on axioms:" p75-2a-check.log
          grep -F "'Lanzarini.p75_centered_inner_identity' depends on axioms:" p75-2b-check.log
          grep -F "'Lanzarini.p75_centered_derivative' depends on axioms:" p75-2b-check.log
          grep -F "'Lanzarini.p75_centered_quadratic_bound' depends on axioms:" p75-3-check.log
          grep -F "'Lanzarini.p75_physical_quadratic_bound' depends on axioms:" p75-3-check.log
          grep -F "'Lanzarini.p75_derivative_speed_bound' depends on axioms:" p75-4-check.log

          grep -F "'Lanzarini.p76_energyVariance_nonneg' depends on axioms:" p76-1-check.log
          grep -F "'Lanzarini.p76_energyVarianceAt_nonneg' depends on axioms:" p76-1-check.log
          grep -F "'Lanzarini.p76_energyVariance_identity' depends on axioms:" p76-2-check.log
          grep -F "'Lanzarini.p76_energyVarianceAt_identity' depends on axioms:" p76-2-check.log
          grep -F "'Lanzarini.p76_energyNormSq_secondMoment' depends on axioms:" p76-3-check.log
          grep -F "'Lanzarini.p76_energyVariance_secondMoment' depends on axioms:" p76-3-check.log
          grep -F "'Lanzarini.p76_energyVarianceAt_secondMoment' depends on axioms:" p76-3-check.log
          grep -F "'Lanzarini.p76_4_centeredState_orthogonal_left' depends on axioms:" p76-4-check.log
          grep -F "'Lanzarini.p76_4_centeredEnergy_inner' depends on axioms:" p76-4-check.log
          grep -F "'Lanzarini.p76_5_centered_velocity_inner' depends on axioms:" p76-5-check.log
          grep -F "'Lanzarini.p76_5b_jacobiNormSq_negI' depends on axioms:" p76-5b-check.log
          grep -F "'Lanzarini.p76_5b_centeredVelocity_variance' depends on axioms:" p76-5b-check.log
          grep -F "'Lanzarini.p76_6_energy_speed_limit' depends on axioms:" p76-6-check.log

          grep -F "'Lanzarini.p77_1a_jacobi_commutes_propagator' depends on axioms:" p77-1a-check.log
          grep -F "'Lanzarini.p77_1b_hamiltonian_intertwining' depends on axioms:" p77-1b-check.log
          grep -F "'Lanzarini.p77_2_energy_pair_conserved' depends on axioms:" p77-2-check.log
          grep -F "'Lanzarini.p77_2_energyMean_conserved' depends on axioms:" p77-2-check.log

          python3 - <<'PY'
          import re
          from pathlib import Path

          log = Path("p77-2-check.log").read_text()
          allowed = {"propext", "Classical.choice", "Quot.sound"}

          for name in (
              "p77_2_energy_pair_conserved",
              "p77_2_energyMean_conserved",
          ):
              pattern = (
                  rf"'Lanzarini\.{re.escape(name)}' "
                  rf"depends on axioms:\s*\[([^\]]*)\]"
              )
              match = re.search(pattern, log)

              if not match:
                  raise SystemExit(f"Missing axioms audit for {name}")

              found = {
                  x.strip()
                  for x in match.group(1).split(",")
                  if x.strip()
              }

              extra = found - allowed
              if extra:
                  raise SystemExit(
                      f"Unauthorized axioms in {name}: {sorted(extra)}"
                  )

              print(f"{name}: standard axioms only: {sorted(found)}")
          PY

      - name: Verify P78.1 exact residual and axioms
        run: |
          set -euo pipefail

          if grep -En '(^|[[:space:]])(sorry|admit|axiom|sorryAx)([[:space:]]|$)' P78_1_ExactSpeedResidual.lean; then
            echo 'Forbidden proof placeholder or axiom in P78.1' >&2
            exit 1
          fi

          LEAN_PATH=".:${LEAN_PATH:-}" lake env lean -o P78_1_ExactSpeedResidual.olean P78_1_ExactSpeedResidual.lean | tee p78-1-check.log

          if grep -Fq 'sorryAx' p78-1-check.log; then
            echo 'Forbidden sorryAx dependency in P78.1' >&2
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path

          log = Path("p78-1-check.log").read_text(encoding="utf-8")
          allowed = {"propext", "Classical.choice", "Quot.sound"}
          names = (
              "p78_1_exact_speed_residual",
              "p78_1_speed_residual_nonneg",
          )

          for name in names:
              prefix = f"'Lanzarini.{name}' depends on axioms:"
              matches = [
                  line.strip()
                  for line in log.splitlines()
                  if line.strip().startswith(prefix)
              ]

              if len(matches) != 1:
                  raise SystemExit(f"Missing or duplicate audit: {name}")

              payload = matches[0][len(prefix):].strip()

              if not (payload.startswith("[") and payload.endswith("]")):
                  raise SystemExit(f"Malformed axiom list for {name}")

              found = {
                  x.strip()
                  for x in payload[1:-1].split(",")
                  if x.strip()
              }

              extra = found - allowed

              if extra:
                  raise SystemExit(f"Unauthorized axioms in {name}: {sorted(extra)}")

              print(f"PASS {name}: {sorted(found)}")
          PY

