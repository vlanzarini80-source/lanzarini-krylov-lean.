
name: Lean 4 Verification

on:
  push:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Lean 4
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch mathlib dependencies
        run: |
          lake update
          lake exe cache get

      - name: Verify all Lean modules through P81.2b.3 Stage A
        run: |
          set -euo pipefail

          lake env lean Main.lean
          lake env lean Jacobi2.lean
          lake env lean JacobiGeneral.lean

          for mod in \
            JacobiReal JacobiEvolution MatrixExpProbe \
            KrylovNumber KrylovGram KrylovLagrange KrylovGap \
            P73_RealTime P73_2_State \
            P74_1_Components P74_2_KrylovDerivative \
            P75_1_Orthogonality P75_2a_VelocityOrthogonality \
            P75_2b_CenteredDerivative P75_3_QuadraticSpeedBound \
            P75_4_DerivativeSpeedBound \
            P76_1_EnergyVariance P76_2_EnergyVarianceIdentity \
            P76_3_EnergySecondMoment P76_4_CenteredEnergySpeed \
            P76_5_CenteredVelocity P76_5b_CenteredVelocityNorm \
            P76_6_EnergySpeedLimit \
            P77_1a_PropagatorCommutes \
            P77_1b_HamiltonianIntertwining \
            P77_2_EnergyMeanConservation \
            P78_1_ExactSpeedResidual \
            P78_2_PhysicalSpeedResidual \
            P79_R0_CoefficientJet \
            P80_1_TrueEvolutionJets \
            P81_1_JacobiPhysicalPowers \
            P81_2a_PhysicalGramBridge \
            P81_2b_InitialPhysicalData \
            P81_2b1_PhysicalAcceleration \
            P81_2b2_PhysicalMinorDerivative \
            P81_2b3_CenteredMinorDerivative
          do
            echo "=== Compiling $mod.lean ==="
            test -f "$mod.lean"
            LEAN_PATH=".:${LEAN_PATH:-}" lake env lean \
              -o "$mod.olean" "$mod.lean" 2>&1 | tee "$mod.log"
          done

      - name: Audit source files and all required theorem axioms
        run: |
          set -euo pipefail

          for mod in \
            P78_1_ExactSpeedResidual \
            P78_2_PhysicalSpeedResidual \
            P79_R0_CoefficientJet \
            P80_1_TrueEvolutionJets \
            P81_1_JacobiPhysicalPowers \
            P81_2a_PhysicalGramBridge \
            P81_2b_InitialPhysicalData \
            P81_2b1_PhysicalAcceleration \
            P81_2b2_PhysicalMinorDerivative \
            P81_2b3_CenteredMinorDerivative
          do
            if grep -En '(^|[[:space:]])(sorry|admit|axiom|sorryAx)([[:space:]]|$)' "$mod.lean"; then
              echo "Forbidden proof placeholder or axiom in $mod" >&2
              exit 1
            fi
          done

          if grep -F 'sorryAx' ./*.log; then
            echo 'Forbidden sorryAx dependency found' >&2
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path

          allowed = {'propext', 'Classical.choice', 'Quot.sound'}
          expected = {
              'P74_1_Components': (
                  'p74_jacobiState_component_hasDerivAt',
                  'p74_jacobiState_parts_hasDerivAt',
              ),
              'P74_2_KrylovDerivative': (
                  'p74_krylovComplexityAt_hasDerivAt',
              ),
              'P75_1_Orthogonality': (
                  'p75_centeredState_orthogonal',
              ),
              'P75_2a_VelocityOrthogonality': (
                  'p75_antiHermitian_real_orthogonal',
                  'p75_state_velocity_real_orthogonal',
              ),
              'P75_2b_CenteredDerivative': (
                  'p75_centered_inner_identity',
                  'p75_centered_derivative',
              ),
              'P75_3_QuadraticSpeedBound': (
                  'p75_centered_quadratic_bound',
                  'p75_physical_quadratic_bound',
              ),
              'P75_4_DerivativeSpeedBound': (
                  'p75_derivative_speed_bound',
              ),
              'P76_1_EnergyVariance': (
                  'p76_energyVariance_nonneg',
                  'p76_energyVarianceAt_nonneg',
              ),
              'P76_2_EnergyVarianceIdentity': (
                  'p76_energyVariance_identity',
                  'p76_energyVarianceAt_identity',
              ),
              'P76_3_EnergySecondMoment': (
                  'p76_energyNormSq_secondMoment',
                  'p76_energyVariance_secondMoment',
                  'p76_energyVarianceAt_secondMoment',
              ),
              'P76_4_CenteredEnergySpeed': (
                  'p76_4_centeredState_orthogonal_left',
                  'p76_4_centeredEnergy_inner',
              ),
              'P76_5_CenteredVelocity': (
                  'p76_5_centered_velocity_inner',
              ),
              'P76_5b_CenteredVelocityNorm': (
                  'p76_5b_jacobiNormSq_negI',
                  'p76_5b_centeredVelocity_variance',
              ),
              'P76_6_EnergySpeedLimit': (
                  'p76_6_energy_speed_limit',
              ),
              'P77_1a_PropagatorCommutes': (
                  'p77_1a_jacobi_commutes_propagator',
              ),
              'P77_1b_HamiltonianIntertwining': (
                  'p77_1b_hamiltonian_intertwining',
              ),
              'P77_2_EnergyMeanConservation': (
                  'p77_2_energy_pair_conserved',
                  'p77_2_energyMean_conserved',
              ),
              'P78_1_ExactSpeedResidual': (
                  'p78_1_exact_speed_residual',
                  'p78_1_speed_residual_nonneg',
              ),
              'P78_2_PhysicalSpeedResidual': (
                  'p78_2_speedChannel_derivative',
                  'p78_2_exact_physical_residual',
              ),
              'P79_R0_CoefficientJet': (
                  'p79_r0_minor12_formula',
                  'p79_r0_minor13_formula',
                  'p79_r0_gramJet_formula',
                  'p79_r0_deficitJet_formula',
              ),
              'P80_1_TrueEvolutionJets': (
                  'p80_1_state_iteratedDeriv',
                  'p80_1_initial_derivative',
              ),
              'P81_1_JacobiPhysicalPowers': (
                  'p81_H_action', 'p81_H1', 'p81_H2',
                  'p81_H3', 'p81_H4',
                  'p81_true_initial_derivatives',
              ),
              'P81_2a_PhysicalGramBridge': (
                  'p81_2_energyMean_zero',
                  'p81_2_centeredVelocity_eq',
                  'p81_2_minor_physical_bridge',
                  'p81_2_minor_algebra',
                  'p81_2_minor_product_rule',
                  'p81_2_state_hasDerivAt',
              ),
              'P81_2b_InitialPhysicalData': (
                  'p81_2b_state_zero',
                  'p81_2b_initial_krylov_zero',
                  'p81_2b_centered_state_zero',
                  'p81_2b_velocity_at_zero',
                  'p81_2b_state_initial_derivative',
                  'p81_2b_minor_zero',
                  'p81_2b_krylov_initial_hasDerivAt',
                  'p81_2b_speedChannel_zero',
              ),
              'P81_2b1_PhysicalAcceleration': (
                  'p81_2b1_generator_action',
                  'p81_2b1_velocity_eq_generator',
                  'p81_2b1_velocity_hasDerivAt',
                  'p81_2b1_initial_acceleration',
              ),
              'P81_2b2_PhysicalMinorDerivative': (
                  'p81_2b2_rawMinor_hasDerivAt',
              ),
              'P81_2b3_CenteredMinorDerivative': (
                  'p81_2b3_K_hasDerivAt',
              ),
          }

          for module, theorem_names in expected.items():
              lines = Path(f'{module}.log').read_text(
                  encoding='utf-8'
              ).splitlines()

              for name in theorem_names:
                  prefix = (
                      f"'Lanzarini.{name}' depends on axioms:"
                  )
                  matches = [
                      line.strip() for line in lines
                      if line.strip().startswith(prefix)
                  ]
                  if len(matches) != 1:
                      raise SystemExit(
                          f'Missing/duplicate axiom audit: {name}'
                      )

                  payload = matches[0][len(prefix):].strip()
                  if not (payload.startswith('[') and
                          payload.endswith(']')):
                      raise SystemExit(
                          f'Invalid axiom list for {name}'
                      )

                  found = {
                      item.strip()
                      for item in payload[1:-1].split(',')
                      if item.strip()
                  }
                  unexpected = found - allowed
                  if unexpected:
                      raise SystemExit(
                          f'Unauthorized axioms for {name}: '
                          f'{sorted(unexpected)}'
                      )
                  print(f'PASS {name}: {sorted(found)}')

          print('All required theorem axiom audits passed.')
          PY
