
name: P84.4r4b Physical Velocity Verification

on:
  push:
    branches:
      - research/p75-centered-derivative
    paths:
      - '**.lean'
      - 'lean-toolchain'
      - 'lakefile.toml'
      - '.github/workflows/p84-4r4b-physical-velocity.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Lean
        run: |
          set -euo pipefail
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Initialize Lake
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          lake exe cache get

      - name: Compile physical velocity bridge
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake env lean P84_4r4b_PhysicalVelocityDerivative_Probe.lean

      - name: Audit theorem axioms
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cat > P84_4r4b_AxiomAudit.lean <<'EOF'
          import P84_4r4b_PhysicalVelocityDerivative_Probe
          #print axioms Lanzarini.p84_4r4b_velocity_bridge
          #print axioms Lanzarini.p84_4r4b_psi_derivative
          EOF
          lake env lean P84_4r4b_AxiomAudit.lean
