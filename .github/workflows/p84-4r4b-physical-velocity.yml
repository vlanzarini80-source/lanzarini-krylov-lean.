
import P84_4r4a_PhysicalEnergyMeanZero_Probe

namespace Lanzarini

/-!
P84.4r4b: physical velocity bridge.

The energy mean vanishes along the
physical four-site Jacobi evolution.

No expected Taylor coefficients.
No P79.
No sorry, admit, or new axioms.
-/

/--
The physical centered velocity equals
-i times the Jacobi Hamiltonian applied
to the evolving physical state.
-/
theorem p84_4r4b_velocity_bridge
    (p q r d e f t : ℝ)
    (j : Fin 4) :
    p84_4l_v p q r d e f t j =
      -Complex.I *
        ((jacobiComplex 4
          (p84_a d e f)
          (p84_b p q r)).mulVec
          (p84_4l_psi p q r d e f t)) j := by

  have hmean :=
    p84_4r4a_energy_mean_zero
      p q r d e f t

  simp only [
    p84_4l_v,
    p76_centeredEnergy,
    hmean,
    Complex.ofReal_zero,
    zero_mul,
    sub_zero
  ]

/--
The physical velocity is identical to
the coordinate derivative of the state.
-/
theorem p84_4r4b_psi_derivative
    (p q r d e f t : ℝ)
    (j : Fin 4) :
    HasDerivAt
      (fun s : ℝ =>
        p84_4l_psi p q r d e f s j)
      (p84_4l_v p q r d e f t j)
      t := by

  have h :=
    p74_jacobiState_component_hasDerivAt
      4
      (p84_a d e f)
      (p84_b p q r)
      t p81_e0 j

  have hv :=
    p84_4r4b_velocity_bridge
      p q r d e f t j

  change
    HasDerivAt
      (fun s : ℝ =>
        p84_4l_psi p q r d e f s j)
      (((-Complex.I) •
        jacobiComplex 4
          (p84_a d e f)
          (p84_b p q r)).mulVec
        (p84_4l_psi p q r d e f t)) j
      t at h

  have hscalar :
      (((-Complex.I) •
        jacobiComplex 4
          (p84_a d e f)
          (p84_b p q r)).mulVec
        (p84_4l_psi p q r d e f t)) j =
      -Complex.I *
        ((jacobiComplex 4
          (p84_a d e f)
          (p84_b p q r)).mulVec
          (p84_4l_psi p q r d e f t)) j := by
    simp [Matrix.mulVec, dotProduct,
      Finset.mul_sum, mul_assoc]

  rw [hscalar, ← hv] at h
  exact h

#print axioms p84_4r4b_velocity_bridge
#print axioms p84_4r4b_psi_derivative

end Lanzarini
