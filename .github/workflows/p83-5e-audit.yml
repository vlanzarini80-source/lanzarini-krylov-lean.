
name: P83.7c Physical Regularity Audit

on:
  workflow_dispatch:
  push:
    branches:
      - research/p75-centered-derivative
    paths:
      - 'P83_5a_PhysicalCenteringBridge_Candidate.lean'
      - 'P83_5d_PhysicalRegularityStep1.lean'
      - 'P83_5e_ContDiffAPI_Probe.lean'
      - 'P83_6_PhysicalFrechetBridge.lean'
      - 'P83_7a_PhysicalStateC1.lean'
      - 'P83_7b_PhysicalVelocityC1.lean'
      - 'P83_7c_PhysicalStateC2.lean'
      - 'P83_PhysicalInitialZeros_Candidate.lean'
      - 'P83_R13SecondPhysicalZero_Candidate.lean'
      - '.github/workflows/lean.yml'
      - '.github/workflows/p83-5e-audit.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Lean with bounded retries
        shell: bash
        run: |
          set -euo pipefail

          for attempt in 1 2 3 4 5 6; do
            echo "=== Lean installation $attempt/6 ==="

            if curl -fL \
              --retry 4 \
              --retry-all-errors \
              --retry-delay 10 \
              --connect-timeout 20 \
              --max-time 120 \
              https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
              -o /tmp/elan-init.sh; then

              if sh /tmp/elan-init.sh -y \
                --default-toolchain none; then

                echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
                echo "PASS: elan installed"
                exit 0
              fi
            fi

            if [ "$attempt" -lt 6 ]; then
              sleep 30
            fi
          done

          echo "INFRASTRUCTURE FAILURE: Lean installer unavailable"
          exit 1

      - name: Verify Lean toolchain
        shell: bash
        run: |
          set -euo pipefail
          cat lean-toolchain
          lean --version
          lake --version

      - name: Fetch mathlib with retries
        shell: bash
        run: |
          set -euo pipefail

          lake update

          for attempt in 1 2 3 4 5; do
            echo "=== Mathlib cache $attempt/5 ==="

            rm -f "$HOME/.cache/mathlib/leantar-0.1.15.tar.gz"

            if lake exe cache get; then
              echo "PASS: mathlib cache"
              exit 0
            fi

            if [ "$attempt" -lt 5 ]; then
              sleep 30
            fi
          done

          echo "INFRASTRUCTURE FAILURE: mathlib cache unavailable"
          exit 1

      - name: Compile modules through P83.7c
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import os
          import re
          import subprocess

          workflow = Path(
              ".github/workflows/lean.yml"
          ).read_text(encoding="utf-8")

          match = re.search(
              r"for mod in \\\s*\n(.*?)^\s*do\s*$",
              workflow,
              re.MULTILINE | re.DOTALL,
          )

          if match is None:
              raise SystemExit(
                  "FAIL: baseline module list not found"
              )

          base = re.findall(
              r"^\s*([A-Za-z0-9_]+)\s*\\?\s*$",
              match.group(1),
              re.MULTILINE,
          )

          if not base or base[-1] != (
              "P83_4b_W13CenteringFourthCancellation"
          ):
              raise SystemExit(
                  "FAIL: unexpected baseline module list"
              )

          extra = [
              "P83_PhysicalInitialZeros_Candidate",
              "P83_R13SecondPhysicalZero_Candidate",
              "P83_5a_PhysicalCenteringBridge_Candidate",
              "P83_5d_PhysicalRegularityStep1",
              "P83_5e_ContDiffAPI_Probe",
              "P83_6_PhysicalFrechetBridge",
              "P83_7a_PhysicalStateC1",
              "P83_7b_PhysicalVelocityC1",
              "P83_7c_PhysicalStateC2",
          ]

          modules = list(dict.fromkeys(base + extra))

          env = os.environ.copy()
          env["LEAN_PATH"] = (
              ".:" + env.get("LEAN_PATH", "")
          )

          for mod in modules:
              src = Path(mod + ".lean")

              if not src.is_file():
                  raise SystemExit(
                      f"FAIL: missing source {src}"
                  )

              print(
                  f"=== COMPILING {src} ===",
                  flush=True,
              )

              result = subprocess.run(
                  [
                      "lake", "env", "lean",
                      "-o", mod + ".olean",
                      str(src),
                  ],
                  env=env,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  text=True,
              )

              Path(mod + ".log").write_text(
                  result.stdout,
                  encoding="utf-8",
              )

              print(result.stdout, flush=True)

              if result.returncode != 0:
                  raise SystemExit(
                      f"FAIL: Lean compilation {src}"
                  )

              if "sorryAx" in result.stdout:
                  raise SystemExit(
                      f"FAIL: sorryAx reported in {src}"
                  )

          print("PASS: all required modules compiled")
          PY

      - name: Audit source and theorem axioms
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          files = [
              "P83_5a_PhysicalCenteringBridge_Candidate",
              "P83_5d_PhysicalRegularityStep1",
              "P83_5e_ContDiffAPI_Probe",
              "P83_6_PhysicalFrechetBridge",
              "P83_7a_PhysicalStateC1",
              "P83_7b_PhysicalVelocityC1",
              "P83_7c_PhysicalStateC2",
          ]

          def strip_comments(src):
              out = []
              i = 0
              depth = 0
              in_string = False

              while i < len(src):
                  if depth:
                      if src.startswith("/-", i):
                          depth += 1
                          i += 2
                      elif src.startswith("-/", i):
                          depth -= 1
                          i += 2
                      else:
                          if src[i] == "\n":
                              out.append("\n")
                          i += 1
                  elif in_string:
                      if src[i] == "\\":
                          i += 2
                      elif src[i] == '"':
                          in_string = False
                          i += 1
                      else:
                          i += 1
                  elif src.startswith("--", i):
                      j = src.find("\n", i)
                      if j < 0:
                          break
                      out.append("\n")
                      i = j + 1
                  elif src.startswith("/-", i):
                      depth = 1
                      i += 2
                  elif src[i] == '"':
                      in_string = True
                      i += 1
                  else:
                      out.append(src[i])
                      i += 1

              if depth or in_string:
                  raise SystemExit(
                      "FAIL: unterminated comment or string"
                  )

              return "".join(out)

          forbidden = re.compile(
              r"\b(?:sorry|admit|sorryAx|axiom)\b"
          )

          for mod in files:
              source = Path(
                  mod + ".lean"
              ).read_text(encoding="utf-8")

              clean = strip_comments(source)

              if forbidden.search(clean):
                  raise SystemExit(
                      f"FAIL: forbidden source token in {mod}"
                  )

              print(f"PASS SOURCE: {mod}")

          expected = {
              "P83_5a_PhysicalCenteringBridge_Candidate": [
                  "p83_5a_physical_centering_fourth_zero",
              ],
              "P83_5d_PhysicalRegularityStep1": [
                  "p83_5d_state_differentiable",
                  "p83_5d_velocity_differentiable",
              ],
              "P83_6_PhysicalFrechetBridge": [
                  "p83_6_state_hasFDerivAt",
                  "p83_6_velocity_hasFDerivAt",
              ],
              "P83_7a_PhysicalStateC1": [
                  "p83_7a_state_contDiff_one",
              ],
              "P83_7b_PhysicalVelocityC1": [
                  "p83_7b_velocity_contDiff_one",
              ],
              "P83_7c_PhysicalStateC2": [
                  "p83_7c_state_contDiff_two",
              ],
          }

          allowed = {
              "propext",
              "Classical.choice",
              "Quot.sound",
          }

          for mod, names in expected.items():
              source = Path(
                  mod + ".lean"
              ).read_text(encoding="utf-8")

              log = Path(
                  mod + ".log"
              ).read_text(encoding="utf-8")

              for name in names:
                  check = "#print axioms " + name

                  if source.count(check) != 1:
                      raise SystemExit(
                          f"FAIL: missing or duplicate {check}"
                      )

                  prefix = (
                      f"'Lanzarini.{name}'"
                      " depends on axioms:"
                  )

                  matches = [
                      line.strip()
                      for line in log.splitlines()
                      if line.strip().startswith(prefix)
                  ]

                  if len(matches) != 1:
                      raise SystemExit(
                          f"FAIL: missing axiom output {name}"
                      )

                  payload = matches[0][len(prefix):].strip()

                  if not (
                      payload.startswith("[")
                      and payload.endswith("]")
                  ):
                      raise SystemExit(
                          f"FAIL: malformed axiom output {name}"
                      )

                  found = {
                      item.strip()
                      for item in payload[1:-1].split(",")
                      if item.strip()
                  }

                  if not found <= allowed:
                      raise SystemExit(
                          f"FAIL: unexpected axioms {name}: "
                          f"{sorted(found - allowed)}"
                      )

                  print(
                      f"PASS AXIOMS {name}: {sorted(found)}"
                  )

          print("PASS: P83.7c source and axiom audit")
          PY
