
name: P84.4l3 Physical Derivative Verification

on:
  push:
    branches:
      - research/p75-centered-derivative
    paths:
      - '**.lean'
      - 'lakefile.toml'
      - 'lean-toolchain'
      - '.github/workflows/p84-4l3-physical-derivative.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Lean toolchain
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lean" --version
          "$HOME/.elan/bin/lake" --version

      - name: Initialize Lake
        shell: bash
        run: |
          set -euo pipefail
          lake update
          test -f lake-manifest.json

      - name: Download mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          lake exe cache get

      - name: Compile local dependency graph and physical bridge
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re
          import subprocess

          root = Path.cwd()
          target = "P84_4l3_PhysicalMinorDerivativeBridge_Candidate"
          output = root / ".lake/build/lib/lean"
          output.mkdir(parents=True, exist_ok=True)

          visited = set()
          active = set()
          order = []

          def visit(module):
              if module in visited:
                  return
              if module in active:
                  raise RuntimeError(
                      f"CYCLIC_IMPORT: {module}"
                  )

              source = root / (
                  module.replace(".", "/") + ".lean"
              )

              if not source.is_file():
                  raise RuntimeError(
                      f"LOCAL_SOURCE_MISSING: {source}"
                  )

              active.add(module)
              content = source.read_text(
                  encoding="utf-8"
              )

              for line in content.splitlines():
                  match = re.match(
                      r"^\s*import\s+(.+?)\s*$",
                      line,
                  )
                  if not match:
                      continue

                  for dependency in match.group(1).split():
                      dep_source = root / (
                          dependency.replace(".", "/")
                          + ".lean"
                      )
                      if dep_source.is_file():
                          visit(dependency)

              active.remove(module)
              visited.add(module)
              order.append(module)

          visit(target)

          print(
              "LOCAL_DEPENDENCY_ORDER:",
              flush=True,
          )
          for module in order:
              print(" ", module, flush=True)

          env = os.environ.copy()
          old_path = env.get("LEAN_PATH", "")

          env["LEAN_PATH"] = (
              str(output)
              + (
                  os.pathsep + old_path
                  if old_path
                  else ""
              )
          )

          combined_log = []

          for module in order:
              source = root / (
                  module.replace(".", "/") + ".lean"
              )
              artifact = output / (
                  module.replace(".", "/") + ".olean"
              )

              artifact.parent.mkdir(
                  parents=True,
                  exist_ok=True,
              )

              command = [
                  "lake",
                  "env",
                  "lean",
                  "-o",
                  str(artifact),
                  str(source),
              ]

              print(
                  "COMPILING:",
                  module,
                  flush=True,
              )

              result = subprocess.run(
                  command,
                  env=env,
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
              )

              combined_log.append(result.stdout)

              print(
                  result.stdout,
                  end="",
                  flush=True,
              )

              if result.returncode != 0:
                  raise SystemExit(
                      f"LEAN_COMPILATION_FAILED: {module}"
                  )

              if not artifact.is_file():
                  raise SystemExit(
                      f"OLEAN_NOT_GENERATED: {module}"
                  )

          Path("p84-4l3.log").write_text(
              "\n".join(combined_log),
              encoding="utf-8",
          )

          print(
              "LOCAL_GRAPH_COMPILATION_PASS",
              flush=True,
          )
          PY

      - name: Audit theorem axioms
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          log_path = Path("p84-4l3.log")

          if not log_path.is_file():
              raise SystemExit(
                  "LEAN_LOG_MISSING"
              )

          log = log_path.read_text(
              encoding="utf-8"
          )

          theorem = (
              "Lanzarini."
              "p84_4l3_physical_minor_derivative"
          )

          reports = re.findall(
              r"(?m)^'([^'\n]+)' depends on axioms:"
              r"\s*\[([^\]\n]*)\]",
              log,
          )

          matches = [
              body
              for name, body in reports
              if name == theorem
          ]

          if len(matches) != 1:
              raise SystemExit(
                  "AXIOM_REPORT_COUNT_INVALID: "
                  f"{len(matches)}"
              )

          allowed = {
              "propext",
              "Classical.choice",
              "Quot.sound",
          }

          for name, body in reports:
              axioms = {
                  item.strip()
                  for item in body.split(",")
                  if item.strip()
              }

              unexpected = axioms - allowed

              if unexpected:
                  raise SystemExit(
                      f"UNEXPECTED_AXIOMS_IN_{name}: "
                      f"{sorted(unexpected)}"
                  )

          actual = {
              item.strip()
              for item in matches[0].split(",")
              if item.strip()
          }

          if re.search(
              r"(?m)^.*error:",
              log,
          ):
              raise SystemExit(
                  "LEAN_ERROR_DETECTED"
              )

          print(
              "ACTUAL_AXIOMS:",
              sorted(actual),
          )
          print(
              "P84_4L3_AXIOM_AUDIT_PASS"
          )
          PY

      - name: Final verification
        shell: bash
        run: |
          set -euo pipefail
          echo "P84_4L3_COMPILATION_AND_AXIOM_AUDIT_PASS"
