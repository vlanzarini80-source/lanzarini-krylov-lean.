
name: P84.4l3 Physical Derivative Verification

on:
  push:
    branches:
      - research/p75-centered-derivative
    paths:
      - 'P84_4l*.lean'
      - '.github/workflows/p84-4l3-physical-derivative.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Lean toolchain
        shell: bash
        run: |
          set -euo pipefail

          curl -sSfL \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none

          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

          "$HOME/.elan/bin/lean" --version
          "$HOME/.elan/bin/lake" --version

          echo "LEAN_TOOLCHAIN_INSTALL_PASS"

      - name: Initialize Lake
        shell: bash
        run: |
          set -euo pipefail

          lake update
          test -f lake-manifest.json
          lake --version

          echo "LAKE_INITIALIZATION_PASS"

      - name: Download mathlib cache
        shell: bash
        run: |
          set -euo pipefail

          lake exe cache get

          echo "MATHLIB_CACHE_PASS"

      - name: Build local Lean dependencies
        shell: bash
        run: |
          set -euo pipefail

          lake build \
            P84_4l2_GramMinorDerivative_Candidate

          test -f \
            .lake/build/lib/lean/P84_4l2_GramMinorDerivative_Candidate.olean

          echo "LOCAL_DEPENDENCIES_BUILT"

      - name: Compile physical derivative bridge
        shell: bash
        run: |
          set -euo pipefail

          lake env lean \
            P84_4l3_PhysicalMinorDerivativeBridge_Candidate.lean \
            2>&1 | tee p84-4l3.log

          echo "PHYSICAL_DERIVATIVE_BRIDGE_COMPILED"

      - name: Audit theorem axioms
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          log = Path("p84-4l3.log").read_text()

          theorem = (
              "Lanzarini."
              "p84_4l3_physical_minor_derivative"
          )

          pattern = (
              r"(?m)^'"
              + re.escape(theorem)
              + r"' depends on axioms:\s*\n"
              + r"((?:[ \t]+[^\n]+\n?)+)"
          )

          match = re.search(pattern, log)

          if match is None:
              raise SystemExit("AXIOM_REPORT_NOT_FOUND")

          actual = {
              line.strip().rstrip(",")
              for line in match.group(1).splitlines()
              if line.strip()
          }

          allowed = {
              "propext",
              "Classical.choice",
              "Quot.sound",
          }

          unexpected = actual - allowed

          if unexpected:
              raise SystemExit(
                  f"UNEXPECTED_AXIOMS: {sorted(unexpected)}"
              )

          if "sorryAx" in log:
              raise SystemExit("SORRY_AXIOM_DETECTED")

          if re.search(r"(?m)^.*error:", log):
              raise SystemExit("LEAN_ERROR_DETECTED")

          print("P84_4L3_AXIOM_AUDIT_PASS")
          print("Actual axioms:", sorted(actual))
          PY

      - name: Final verification marker
        shell: bash
        run: |
          set -euo pipefail

          echo "P84_4L3_COMPILATION_AND_AXIOM_AUDIT_PASS"
