
name: P85.4 OPT2 Physical Initial Jet Evaluation

on:
  push:
    branches:
      - research/p75-centered-derivative
    paths:
      - 'p85_4_optimize.py'
      - 'P85_4_PhysicalInitialJetEvaluation.lean'
      - '.github/workflows/p85-4-physical-initial-jet-evaluation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p85-4-optimized
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize evidence
        shell: bash
        run: |
          set -euo pipefail

          git rev-parse HEAD | tee p85-4.log

          test -f p85_4_optimize.py
          test -f P85_4_PhysicalInitialJetEvaluation.lean
          test -f P85_3_GeneralPhysicalVarianceAndDeficitJets.lean

          sha256sum \
            p85_4_optimize.py \
            P85_4_PhysicalInitialJetEvaluation.lean \
            | tee -a p85-4.log

      - name: Generate optimized symbolic evaluator
        shell: bash
        run: |
          set -euo pipefail

          python3 -m pip install sympy==1.14.0

          python3 -u p85_4_optimize.py \
            | tee -a p85-4.log

          test -s p85-4-generated-theorems.txt

          cp P85_4_PhysicalInitialJetEvaluation.lean \
            p85-4-optimized-source.lean

          sha256sum p85-4-optimized-source.lean \
            | tee -a p85-4.log

      - name: Install Lean
        shell: bash
        run: |
          set -euo pipefail

          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none

          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Initialize Lake
        shell: bash
        run: |
          set -euo pipefail

          cat lean-toolchain
          lean --version | tee -a p85-4.log

          if [ ! -f lake-manifest.json ]; then
            lake update
          fi

          test -f lake-manifest.json

          lake exe cache get

      - name: Compile with live diagnostics
        timeout-minutes: 18
        shell: bash
        run: |
          set -euo pipefail

          python3 -u - <<'PY'
          from pathlib import Path
          import os
          import re
          import subprocess
          import hashlib
          import time
          import signal

          root = Path.cwd()

          target = "P85_4_PhysicalInitialJetEvaluation"

          output = root / ".lake/build/lib/lean"
          output.mkdir(parents=True, exist_ok=True)

          logfile = root / "p85-4.log"

          visited = set()
          active = set()
          order = []

          def source_path(module):
              return root / (
                  module.replace(".", "/") + ".lean"
              )

          def visit(module):

              if module.startswith("P79"):
                  raise SystemExit(
                      f"FORBIDDEN_P79: {module}"
                  )

              if module in visited:
                  return

              if module in active:
                  raise SystemExit(
                      f"CYCLIC_IMPORT: {module}"
                  )

              source = source_path(module)

              if not source.is_file():
                  raise SystemExit(
                      f"MISSING_SOURCE: {module}"
                  )

              active.add(module)

              for line in source.read_text(
                  encoding="utf-8"
              ).splitlines():

                  match = re.match(
                      r"^\s*import\s+(.+?)\s*$",
                      line
                  )

                  if match:

                      dependencies = match.group(1).split(
                          "--", 1
                      )[0].split()

                      for dependency in dependencies:

                          if dependency.startswith("P79"):
                              raise SystemExit(
                                  f"FORBIDDEN_P79: {dependency}"
                              )

                          if source_path(dependency).is_file():
                              visit(dependency)

              active.remove(module)
              visited.add(module)
              order.append(module)

          visit(target)

          required = {
              "P80_1_TrueEvolutionJets",
              "P85_1_GeneralPhysicalJetClosure",
              "P85_2_GeneralPhysicalObservableJets",
              "P85_3_GeneralPhysicalVarianceAndDeficitJets",
              target
          }

          if not required.issubset(set(order)):
              raise SystemExit(
                  "REQUIRED_DEPENDENCY_MISSING"
              )

          env = os.environ.copy()

          old = env.get("LEAN_PATH", "")

          env["LEAN_PATH"] = str(output) + (
              os.pathsep + old if old else ""
          )

          def log(message):

              print(message, flush=True)

              with logfile.open(
                  "a", encoding="utf-8"
              ) as file:

                  file.write(message + "\n")

          log("LOCAL_DEPENDENCY_ORDER:")

          for module in order:
              log(module)

          for module in order:

              source = source_path(module)

              artifact = output / (
                  module.replace(".", "/") + ".olean"
              )

              artifact.parent.mkdir(
                  parents=True,
                  exist_ok=True
              )

              if artifact.exists():
                  artifact.unlink()

              log(f"COMPILING: {module}")

              log(
                  "SOURCE_SHA256: " +
                  hashlib.sha256(
                      source.read_bytes()
                  ).hexdigest()
              )

              started = time.monotonic()

              command = [
                  "timeout",
                  "--foreground",
                  "--kill-after=5s",
                  "480" if module == target else "180",
                  "lake",
                  "env",
                  "lean",
                  "-o",
                  str(artifact),
                  str(source)
              ]

              fatal_error = False

              with subprocess.Popen(
                  command,
                  env=env,
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  bufsize=1,
                  start_new_session=True
              ) as process:

                  for line in process.stdout:

                      message = line.rstrip("\n")

                      log(message)

                      if (
                          re.search(
                              r"(?:^|:\s)error:",
                              message
                          )
                          or "sorryAx" in message
                          or re.search(
                              r"warning:.*sorry",
                              message,
                              re.IGNORECASE
                          )
                      ):

                          fatal_error = True

                          log(
                              f"FAIL_FAST_TRIGGERED: {module}"
                          )

                          try:
                              os.killpg(
                                  process.pid,
                                  signal.SIGTERM
                              )
                          except ProcessLookupError:
                              pass

                          try:
                              process.wait(timeout=5)
                          except subprocess.TimeoutExpired:

                              try:
                                  os.killpg(
                                      process.pid,
                                      signal.SIGKILL
                                  )
                              except ProcessLookupError:
                                  pass

                          break

                  code = process.wait()

              log(f"EXIT_CODE: {code}")

              log(
                  f"ELAPSED_SECONDS: "
                  f"{time.monotonic()-started:.2f}"
              )

              if fatal_error:
                  raise SystemExit(
                      f"LEAN_FIRST_ERROR: {module}"
                  )

              if code in (124, 137):
                  raise SystemExit(
                      f"COMPUTATION_TIMEOUT: {module}"
                  )

              if code != 0:
                  raise SystemExit(
                      f"LEAN_COMPILATION_FAILED: {module}"
                  )

              if not artifact.is_file():
                  raise SystemExit(
                      f"MISSING_OLEAN: {module}"
                  )

              if artifact.stat().st_size == 0:
                  raise SystemExit(
                      f"EMPTY_OLEAN: {module}"
                  )

              log(f"MODULE_PASS: {module}")

          log("P85_4_OPT_COMPILATION_PASS")
          PY

      - name: Strict axiom audit
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re
          import json
          import subprocess
          import hashlib

          log = Path("p85-4.log").read_text(
              encoding="utf-8"
          )

          original_names = [
              "p85_4_stateJet_power",
              "p85_4_stateJet_physical",
              "p85_4_complexPair_bridge",
              "p85_4_probability_bridge",
              "p85_4_K_bridge",
              "p85_4_M2_bridge",
              "p85_4_realPair_bridge",
              "p85_4_V_bridge",
              "p85_4_F_bridge",
              "p85_4_F_physical",
              "p85_4_V_physical",
              "p85_4_generator_action",
              "p85_4_variance_second",
              "p85_4_deficit_fourth",
              "p85_4_deficit_sixth",
              "p85_4_DOI_lower_cancellations",
              "p85_4_DOI_eighth"
          ]

          expected = {
              "Lanzarini." + name
              for name in original_names
          }

          generated = set(
              Path(
                  "p85-4-generated-theorems.txt"
              ).read_text(
                  encoding="utf-8"
              ).splitlines()
          )

          if len(generated) != 70:
              raise SystemExit(
                  "UNEXPECTED_GENERATED_THEOREM_COUNT"
              )

          expected.update(generated)

          allowed = {
              "propext",
              "Classical.choice",
              "Quot.sound"
          }

          reports = {}

          for name, body in re.findall(
              r"(?m)^'([^'\n]+)' depends on axioms:"
              r"\s*\[([^\]]*)\]",
              log
          ):

              axioms = {
                  item.strip()
                  for item in body.split(",")
                  if item.strip()
              }

              reports.setdefault(
                  name, []
              ).append(axioms)

          for name in re.findall(
              r"(?m)^'([^'\n]+)' does not depend on any axioms",
              log
          ):

              reports.setdefault(
                  name, []
              ).append(set())

          for name in sorted(expected):

              if len(reports.get(name, [])) != 1:
                  raise SystemExit(
                      f"MISSING_OR_DUPLICATE_REPORT: {name}"
                  )

          for name, entries in reports.items():

              for axioms in entries:

                  unexpected = axioms - allowed

                  if unexpected:
                      raise SystemExit(
                          f"UNEXPECTED_AXIOMS: {name}: "
                          f"{sorted(unexpected)}"
                      )

          if "sorryAx" in log:
              raise SystemExit(
                  "SORRY_AXIOM_DETECTED"
              )

          if re.search(
              r"(?mi)^.*warning:.*sorry",
              log
          ):
              raise SystemExit(
                  "SORRY_WARNING_DETECTED"
              )

          if re.search(r"(?m)^.*error:", log):
              raise SystemExit(
                  "LEAN_ERROR_DETECTED"
              )

          if "P85_4_OPT_COMPILATION_PASS" not in log:
              raise SystemExit(
                  "COMPILATION_MARKER_MISSING"
              )

          commit = subprocess.check_output(
              ["git", "rev-parse", "HEAD"],
              text=True
          ).strip()

          receipt = {
              "checkpoint": "P85.4-OPT2",
              "commit": commit,
              "lean_compilation": True,
              "axiom_audit": True,
              "original_theorems": 17,
              "generated_theorems": len(generated),
              "expected_theorems": len(expected),
              "optimizer_sha256":
                  hashlib.sha256(
                      Path(
                          "p85_4_optimize.py"
                      ).read_bytes()
                  ).hexdigest(),
              "optimized_source_sha256":
                  hashlib.sha256(
                      Path(
                          "p85-4-optimized-source.lean"
                      ).read_bytes()
                  ).hexdigest(),
              "audited_theorems": {
                  name: sorted(reports[name][0])
                  for name in sorted(expected)
              },
              "four_site_lower_cancellations_verified": True,
              "four_site_eighth_derivative_verified": True,
              "normalized_limit_verified": False,
              "asymptotic_remainder_verified": False,
              "general_theorem_8_1_verified": False,
              "doi": "10.5281/zenodo.23163367",
              "doi_full_validation": False
          }

          Path("p85-4-audit.json").write_text(
              json.dumps(receipt, indent=2) + "\n",
              encoding="utf-8"
          )

          print(
              "EXPECTED_THEOREMS_AUDITED:",
              len(expected)
          )

          print("P85_4_OPT_AXIOM_AUDIT_PASS")
          PY

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p85-4-optimized-evidence
          path: |
            p85-4.log
            p85-4-audit.json
            p85-4-optimized-source.lean
            p85-4-generated-theorems.txt
          if-no-files-found: warn

      - name: Final checkpoint
        shell: bash
        run: |
          set -euo pipefail

          test -s p85-4-audit.json
          test -s p85-4-optimized-source.lean

          echo "P85_4_OPT2_COMPILATION_AND_AXIOM_AUDIT_PASS"
