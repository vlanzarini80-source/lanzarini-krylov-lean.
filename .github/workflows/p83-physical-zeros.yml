
name: P83 Physical Initial Zeros

on:
  push:
  workflow_dispatch:

jobs:
  verify-physical-zeros:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Lean
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: |
          set -euo pipefail
          lake update
          lake exe cache get

      - name: Compile physical dependencies
        run: |
          set -euo pipefail
          for mod in \
            JacobiReal JacobiEvolution MatrixExpProbe \
            KrylovNumber KrylovGram KrylovLagrange KrylovGap \
            P73_RealTime P73_2_State \
            P74_1_Components P74_2_KrylovDerivative \
            P75_1_Orthogonality P75_2a_VelocityOrthogonality \
            P75_2b_CenteredDerivative P75_3_QuadraticSpeedBound \
            P75_4_DerivativeSpeedBound \
            P76_1_EnergyVariance P76_2_EnergyVarianceIdentity \
            P76_3_EnergySecondMoment P76_4_CenteredEnergySpeed \
            P76_5_CenteredVelocity P76_5b_CenteredVelocityNorm \
            P76_6_EnergySpeedLimit \
            P77_1a_PropagatorCommutes \
            P77_1b_HamiltonianIntertwining \
            P77_2_EnergyMeanConservation \
            P78_1_ExactSpeedResidual \
            P78_2_PhysicalSpeedResidual \
            P79_R0_CoefficientJet \
            P80_1_TrueEvolutionJets \
            P81_1_JacobiPhysicalPowers \
            P81_2a_PhysicalGramBridge \
            P81_2b_InitialPhysicalData \
            P81_2b1_PhysicalAcceleration \
            P81_2b2_PhysicalMinorDerivative \
            P81_2b3_CenteredMinorDerivative \
            P81_2b3b_CenteredMinorBridge \
            P82_2_PhysicalJets P82_NormSqProbe \
            P82_3_PhysicalObservables \
            P82_4a_PhysicalResidual \
            P82_4b_PhysicalResidualDerivative \
            P82_4c_PhysicalAccelerationBridge \
            P82_5_PhysicalKrylovAcceleration \
            P82_6_PhysicalResidualDerivative \
            P82_7_InitialResidualCancellation \
            P83_1_PhysicalGramJets \
            P83_2_PhysicalMinorAcceleration
          do
            LEAN_PATH=".:${LEAN_PATH:-}" lake env lean \
              -o "$mod.olean" "$mod.lean"
          done

      - name: Compile four physical cancellations
        run: |
          set -euo pipefail
          LEAN_PATH=".:${LEAN_PATH:-}" lake env lean \
            -o P83_PhysicalInitialZeros_Candidate.olean \
            P83_PhysicalInitialZeros_Candidate.lean \
            2>&1 | tee p83-physical.log

      - name: Compile R13 second derivative zero
        run: |
          set -euo pipefail
          test -f P83_PhysicalInitialZeros_Candidate.olean
          LEAN_PATH=".:${LEAN_PATH:-}" lake env lean \
            -o P83_R13SecondPhysicalZero_Candidate.olean \
            P83_R13SecondPhysicalZero_Candidate.lean \
            2>&1 | tee p83-r13-second.log

      - name: Audit all six physical theorems
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          modules = {
              "P83_PhysicalInitialZeros_Candidate": (
                  "p83-physical.log",
                  (
                      "p83_physical_K_zero",
                      "p83_physical_K_first_zero",
                      "p83_physical_R13_zero",
                      "p83_physical_R13_first_zero",
                  ),
              ),
              "P83_R13SecondPhysicalZero_Candidate": (
                  "p83-r13-second.log",
                  (
                      "p83_r13_initial_acceleration_site3",
                      "p83_physical_R13_second_zero",
                  ),
              ),
          }

          allowed = {
              "propext",
              "Classical.choice",
              "Quot.sound",
          }

          for module, (logfile, theorems) in modules.items():
              source = Path(
                  module + ".lean"
              ).read_text(encoding="utf-8")

              log = Path(
                  logfile
              ).read_text(encoding="utf-8")

              uncommented = re.sub(
                  r"/-.*?-/",
                  "",
                  source,
                  flags=re.S,
              )

              uncommented = re.sub(
                  r"--[^\n]*",
                  "",
                  uncommented,
              )

              bad = re.search(
                  r"\b(?:sorry|admit|sorryAx|axiom)\b",
                  uncommented,
              )

              if bad:
                  raise SystemExit(
                      f"FAIL: forbidden Lean token "
                      f"{bad.group()} in {module}"
                  )

              if "sorryAx" in log:
                  raise SystemExit(
                      f"FAIL: sorryAx in compiler "
                      f"output for {module}"
                  )

              for name in theorems:
                  declaration = (
                      r"\btheorem\s+"
                      + re.escape(name)
                      + r"\b"
                  )

                  if len(
                      re.findall(
                          declaration,
                          uncommented,
                      )
                  ) != 1:
                      raise SystemExit(
                          f"FAIL: theorem declaration "
                          f"absent or duplicate: {name}"
                      )

                  if source.count(
                      "#print axioms " + name
                  ) != 1:
                      raise SystemExit(
                          f"FAIL: axiom print absent "
                          f"or duplicate: {name}"
                      )

                  prefix = (
                      f"'Lanzarini.{name}'"
                      " depends on axioms:"
                  )

                  matching = [
                      line.strip()
                      for line in log.splitlines()
                      if line.strip().startswith(prefix)
                  ]

                  if len(matching) != 1:
                      raise SystemExit(
                          f"FAIL: axiom report absent "
                          f"or duplicate: {name}"
                      )

                  payload = matching[0][
                      len(prefix):
                  ].strip()

                  if not (
                      payload.startswith("[")
                      and payload.endswith("]")
                  ):
                      raise SystemExit(
                          f"FAIL: malformed axiom "
                          f"list: {name}"
                      )

                  found = {
                      x.strip()
                      for x in payload[1:-1].split(",")
                      if x.strip()
                  }

                  unexpected = found - allowed

                  if unexpected:
                      raise SystemExit(
                          f"FAIL: unauthorized axioms "
                          f"for {name}: "
                          f"{sorted(unexpected)}"
                      )

                  print(
                      f"PASS {name}: "
                      f"axioms={sorted(found)}"
                  )

          print(
              "PASS: six physical initial-data "
              "theorems compiled and audited"
          )
          PY
