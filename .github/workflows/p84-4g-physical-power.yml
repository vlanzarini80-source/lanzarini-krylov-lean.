
name: P84.4g Physical Power Isolated Verification

on:
  workflow_dispatch:
  push:
    branches:
      - research/p75-centered-derivative
    paths:
      - P84_4g_PhysicalPowerBridge_Candidate.lean
      - .github/workflows/p84-4g-physical-power.yml

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lean
        run: |
          set -euo pipefail
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh |
            sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Initialize dependencies
        run: |
          set -euo pipefail
          lake update
          lake exe cache get

      - name: Compile physical dependency chain
        run: |
          set -euo pipefail
          export LEAN_PATH="$(pwd):${LEAN_PATH:-}"
          for mod in \
            JacobiReal JacobiEvolution MatrixExpProbe \
            KrylovNumber KrylovGram KrylovLagrange KrylovGap \
            P73_RealTime P73_2_State \
            P74_1_Components P74_2_KrylovDerivative \
            P75_1_Orthogonality \
            P75_2a_VelocityOrthogonality \
            P75_2b_CenteredDerivative \
            P75_3_QuadraticSpeedBound \
            P75_4_DerivativeSpeedBound \
            P76_1_EnergyVariance \
            P76_2_EnergyVarianceIdentity \
            P76_3_EnergySecondMoment \
            P76_4_CenteredEnergySpeed \
            P76_5_CenteredVelocity \
            P76_5b_CenteredVelocityNorm \
            P76_6_EnergySpeedLimit \
            P77_1a_PropagatorCommutes \
            P77_1b_HamiltonianIntertwining \
            P77_2_EnergyMeanConservation \
            P78_1_ExactSpeedResidual \
            P78_2_PhysicalSpeedResidual \
            P80_1_TrueEvolutionJets \
            P81_1_JacobiPhysicalPowers \
            P84_4a_GeneralJacobiPowers \
            P84_4b_GeneralThirdPower \
            P84_4f1_GeneralFourthPower
          do
            lake env lean -o "$mod.olean" "$mod.lean"
          done

      - name: Compile physical power bridge
        run: |
          set -euo pipefail
          export LEAN_PATH="$(pwd):${LEAN_PATH:-}"
          lake env lean \
            P84_4g_PhysicalPowerBridge_Candidate.lean \
            2>&1 | tee p84-physical-power.log

      - name: Audit theorem declarations and axioms
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          source = Path(
              "P84_4g_PhysicalPowerBridge_Candidate.lean"
          ).read_text()
          log = Path("p84-physical-power.log").read_text()

          clean = re.sub(r"/-.*?-/", "", source, flags=re.S)
          clean = re.sub(r"--[^\n]*", "", clean)

          if re.search(
              r"\b(sorry|admit|axiom|sorryAx)\b", clean
          ):
              raise SystemExit("FORBIDDEN_LEAN_TOKEN")

          allowed = {
              "propext", "Classical.choice", "Quot.sound"
          }

          for name in (
              "p84_4g_H3_site3",
              "p84_4g_H4_site3",
          ):
              if len(re.findall(
                  r"\btheorem\s+" + name + r"\b", clean
              )) != 1:
                  raise SystemExit("MISSING_THEOREM: " + name)

              if clean.count("#print axioms " + name) != 1:
                  raise SystemExit("MISSING_AXIOM_AUDIT: " + name)

              pattern = (
                  r"'Lanzarini\." + name +
                  r"' depends on axioms:\s*\[([^\]]*)\]"
              )
              matches = re.findall(pattern, log)

              if len(matches) != 1:
                  raise SystemExit("MISSING_AXIOM_REPORT: " + name)

              found = {
                  x.strip() for x in matches[0].split(",")
                  if x.strip()
              }

              if not found <= allowed:
                  raise SystemExit(
                      "UNEXPECTED_AXIOMS: " + str(found - allowed)
                  )

              print("PASS", name, sorted(found))

          print("PHYSICAL_POWER_BRIDGE_AUDIT_PASS")
          PY
