
name: P84 General Jacobi Verification

on:
  push:
    branches:
      - research/p75-centered-derivative
    paths:
      - 'P84_4a_GeneralJacobiPowers.lean'
      - 'P84_4b_GeneralThirdPower.lean'
      - 'P84_4c1_GeneralPhysicalObservables.lean'
      - 'P84_4c2_GeneralPhysicalDeficit.lean'
      - 'P84_4c3_GeneralKrylovDerivative.lean'
      - 'P84_4d1_PhysicalObservableBridge.lean'
      - 'P84_4d2_ComponentProbabilityDerivative.lean'
      - 'P84_4d3_PhysicalMomentDerivatives.lean'
      - 'P84_4d4_PhysicalMomentIdentification.lean'
      - 'P84_4d5_PhysicalMomentDerivativeBridge.lean'
      - '.github/workflows/p84-4a-verification.yml'
      - '.github/workflows/lean.yml'
  workflow_dispatch:

jobs:
  verify-p84:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Lean
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch mathlib
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get

      - name: Compile prerequisite modules
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          source = Path(
              '.github/workflows/lean.yml'
          ).read_text(encoding='utf-8')

          match = re.search(
              r'for mod in\s*\\\s*\n(.*?)\n\s*do\s*\n',
              source,
              flags=re.S
          )

          if match is None:
              raise SystemExit(
                  'Cannot locate prerequisite module list'
              )

          modules = (
              match.group(1)
              .replace('\\', ' ')
              .split()
          )

          if 'P83_4b_W13CenteringFourthCancellation' not in modules:
              raise SystemExit(
                  'Unexpected prerequisite module list'
              )

          targets = {
              'P84_4a_GeneralJacobiPowers',
              'P84_4b_GeneralThirdPower',
              'P84_4c1_GeneralPhysicalObservables',
              'P84_4c2_GeneralPhysicalDeficit',
              'P84_4c3_GeneralKrylovDerivative',
              'P84_4d1_PhysicalObservableBridge',
              'P84_4d2_ComponentProbabilityDerivative',
              'P84_4d3_PhysicalMomentDerivatives',
              'P84_4d4_PhysicalMomentIdentification',
              'P84_4d5_PhysicalMomentDerivativeBridge',
          }

          modules = [
              m for m in modules
              if m not in targets
          ]

          if len(modules) != len(set(modules)):
              raise SystemExit(
                  'Duplicate prerequisite modules'
              )

          Path('/tmp/p84-prerequisites.txt').write_text(
              '\n'.join(modules) + '\n',
              encoding='utf-8'
          )

          print('Prerequisite modules:', len(modules))
          PY

          lake env lean -o Main.olean Main.lean
          lake env lean -o Jacobi2.olean Jacobi2.lean
          lake env lean -o JacobiGeneral.olean JacobiGeneral.lean

          while IFS= read -r mod; do
            echo "=== Compiling $mod.lean ==="
            test -f "$mod.lean"
            LEAN_PATH=".:${LEAN_PATH:-}" lake env lean \
              -o "$mod.olean" "$mod.lean"
          done < /tmp/p84-prerequisites.txt

      - name: Audit P84 source files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          required = {
              'P84_4a_GeneralJacobiPowers': [
                  'p84_H_action',
                  'p84_H1',
                  'p84_H2',
                  'p84_initial_derivatives',
              ],
              'P84_4b_GeneralThirdPower': [
                  'p84_4b_H3',
              ],
              'P84_4c1_GeneralPhysicalObservables': [
                  'p84_4c1_state_zero',
                  'p84_4c1_K_zero',
                  'p84_4c1_M2_zero',
                  'p84_4c1_V_zero',
              ],
              'P84_4c2_GeneralPhysicalDeficit': [
                  'p84_4c2_velocity_identity',
                  'p84_4c2_D_identity',
              ],
              'P84_4c3_GeneralKrylovDerivative': [
                  'p84_4c3_K_hasDerivAt',
              ],
              'P84_4d1_PhysicalObservableBridge': [
                  'p84_4d1_state_initial_jet',
                  'p84_4d1_K_deriv_eq_J',
                  'p84_4d1_D_physical_derivative',
              ],
              'P84_4d2_ComponentProbabilityDerivative': [
                  'p84_4d2_probability_hasDerivAt',
              ],
              'P84_4d3_PhysicalMomentDerivatives': [
                  'p84_4d3_Kprob_hasDerivAt',
                  'p84_4d3_M2prob_hasDerivAt',
              ],
              'P84_4d4_PhysicalMomentIdentification': [
                  'p84_4d4_probability_eq_normSq',
                  'p84_4d4_Kprob_eq_K',
                  'p84_4d4_M2prob_eq_M2',
              ],
              'P84_4d5_PhysicalMomentDerivativeBridge': [
                  'p84_4d5_K_hasDerivAt',
                  'p84_4d5_M2_hasDerivAt',
              ],
          }

          for module, names in required.items():
              source = Path(
                  f'{module}.lean'
              ).read_text(encoding='utf-8')

              clean = re.sub(
                  r'/-.*?-/', '',
                  source,
                  flags=re.S
              )
              clean = re.sub(
                  r'--[^\n]*', '', clean
              )

              forbidden = re.search(
                  r'\b(sorry|admit|axiom|sorryAx)\b',
                  clean
              )

              if forbidden:
                  raise SystemExit(
                      f'Forbidden token in {module}: '
                      f'{forbidden.group()}'
                  )

              for name in names:
                  if not re.search(
                      rf'\btheorem\s+{name}\b',
                      clean
                  ):
                      raise SystemExit(
                          f'Missing theorem: {name}'
                      )

                  if f'#print axioms {name}' not in clean:
                      raise SystemExit(
                          f'Missing axiom audit: {name}'
                      )

              print(f'PASS source audit: {module}')
          PY

      - name: Compile P84 modules
        shell: bash
        run: |
          set -euo pipefail

          modules=(
            P84_4a_GeneralJacobiPowers
            P84_4b_GeneralThirdPower
            P84_4c1_GeneralPhysicalObservables
            P84_4c2_GeneralPhysicalDeficit
            P84_4c3_GeneralKrylovDerivative
            P84_4d1_PhysicalObservableBridge
            P84_4d2_ComponentProbabilityDerivative
            P84_4d3_PhysicalMomentDerivatives
            P84_4d4_PhysicalMomentIdentification
            P84_4d5_PhysicalMomentDerivativeBridge
          )

          labels=(
            4a 4b 4c1 4c2 4c3
            4d1 4d2 4d3 4d4 4d5
          )

          for i in "${!modules[@]}"; do
            mod="${modules[$i]}"
            label="${labels[$i]}"

            echo "=== Compile $mod ==="
            test -f "$mod.lean"

            LEAN_PATH=".:${LEAN_PATH:-}" lake env lean \
              -o "$mod.olean" "$mod.lean" \
              2>&1 | tee "p84-${label}.log"
          done

      - name: Audit P84 theorem axioms
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          checks = {
              'p84-4a.log': [
                  'p84_H_action',
                  'p84_H1',
                  'p84_H2',
                  'p84_initial_derivatives',
              ],
              'p84-4b.log': [
                  'p84_4b_H3',
              ],
              'p84-4c1.log': [
                  'p84_4c1_state_zero',
                  'p84_4c1_K_zero',
                  'p84_4c1_M2_zero',
                  'p84_4c1_V_zero',
              ],
              'p84-4c2.log': [
                  'p84_4c2_velocity_identity',
                  'p84_4c2_D_identity',
              ],
              'p84-4c3.log': [
                  'p84_4c3_K_hasDerivAt',
              ],
              'p84-4d1.log': [
                  'p84_4d1_state_initial_jet',
                  'p84_4d1_K_deriv_eq_J',
                  'p84_4d1_D_physical_derivative',
              ],
              'p84-4d2.log': [
                  'p84_4d2_probability_hasDerivAt',
              ],
              'p84-4d3.log': [
                  'p84_4d3_Kprob_hasDerivAt',
                  'p84_4d3_M2prob_hasDerivAt',
              ],
              'p84-4d4.log': [
                  'p84_4d4_probability_eq_normSq',
                  'p84_4d4_Kprob_eq_K',
                  'p84_4d4_M2prob_eq_M2',
              ],
              'p84-4d5.log': [
                  'p84_4d5_K_hasDerivAt',
                  'p84_4d5_M2_hasDerivAt',
              ],
          }

          allowed = {
              'propext',
              'Classical.choice',
              'Quot.sound',
          }

          for filename, names in checks.items():
              lines = Path(filename).read_text(
                  encoding='utf-8'
              ).splitlines()

              for name in names:
                  prefix = (
                      f"'Lanzarini.{name}' "
                      f"depends on axioms:"
                  )

                  matches = [
                      line.strip()
                      for line in lines
                      if line.strip().startswith(prefix)
                  ]

                  if len(matches) != 1:
                      raise SystemExit(
                          f'Missing or duplicate audit: {name}'
                      )

                  payload = matches[0][
                      len(prefix):
                  ].strip()

                  if not (
                      payload.startswith('[')
                      and payload.endswith(']')
                  ):
                      raise SystemExit(
                          f'Invalid axiom output: {name}'
                      )

                  found = {
                      x.strip()
                      for x in payload[1:-1].split(',')
                      if x.strip()
                  }

                  unexpected = found - allowed

                  if unexpected:
                      raise SystemExit(
                          f'Unauthorized axioms in {name}: '
                          f'{sorted(unexpected)}'
                      )

                  print(
                      f'PASS {name}: {sorted(found)}'
                  )

          print('P84.4a through P84.4d5 audit PASS')
          PY
