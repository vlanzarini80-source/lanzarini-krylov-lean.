
name: P84.4r3 Physical Minor Verification

on:
  push:
    branches:
      - research/p75-centered-derivative
    paths:
      - '**.lean'
      - 'lean-toolchain'
      - 'lakefile.toml'
      - '.github/workflows/p84-4r3-physical-minor.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Lean
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          use-mathlib-cache: true

      - name: Compile P84.4r3 and dependencies
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import os
          import re
          import subprocess

          target = "P84_4r3_PhysicalMinorBridge_Probe"
          root = Path.cwd()
          output = root / ".lake/build/lib/lean"
          output.mkdir(parents=True, exist_ok=True)

          visited = set()
          active = set()
          order = []

          def visit(module):
              if module in visited:
                  return
              if module in active:
                  raise RuntimeError(
                      f"CYCLIC_IMPORT: {module}"
                  )

              source = root / (
                  module.replace(".", "/") + ".lean"
              )
              if not source.is_file():
                  raise RuntimeError(
                      f"MISSING_SOURCE: {source}"
                  )

              active.add(module)

              for line in source.read_text(
                  encoding="utf-8"
              ).splitlines():
                  match = re.match(
                      r"^\s*import\s+(.+?)\s*$",
                      line
                  )
                  if match:
                      for dependency in match.group(1).split():
                          dep_source = root / (
                              dependency.replace(".", "/")
                              + ".lean"
                          )
                          if dep_source.is_file():
                              visit(dependency)

              active.remove(module)
              visited.add(module)
              order.append(module)

          visit(target)

          env = os.environ.copy()
          old = env.get("LEAN_PATH", "")
          env["LEAN_PATH"] = str(output) + (
              os.pathsep + old if old else ""
          )

          logs = []

          for module in order:
              source = root / (
                  module.replace(".", "/") + ".lean"
              )
              artifact = output / (
                  module.replace(".", "/") + ".olean"
              )
              artifact.parent.mkdir(
                  parents=True, exist_ok=True
              )

              result = subprocess.run(
                  [
                      "lake", "env", "lean",
                      "-o", str(artifact),
                      str(source)
                  ],
                  env=env,
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT
              )

              print("COMPILING:", module, flush=True)
              print(result.stdout, flush=True)
              logs.append(result.stdout)

              if result.returncode != 0:
                  raise SystemExit(
                      f"LEAN_COMPILATION_FAILED: {module}"
                  )

              if not artifact.is_file():
                  raise SystemExit(
                      f"MISSING_OLEAN: {module}"
                  )

          Path("p84-r3.log").write_text(
              "\n".join(logs),
              encoding="utf-8"
          )

          print("P84_R3_COMPILATION_PASS")
          PY

      - name: Audit both theorem axioms
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          log = Path("p84-r3.log").read_text(
              encoding="utf-8"
          )

          expected = {
              "Lanzarini.p84_4r3_physical_derivative",
              "Lanzarini.p84_4r3_first_minor_derivative"
          }

          allowed = {
              "propext",
              "Classical.choice",
              "Quot.sound"
          }

          reports = re.findall(
              r"(?m)^'([^'\n]+)' depends on axioms:"
              r"\s*\[([^\]\n]*)\]",
              log
          )

          for theorem in expected:
              matches = [
                  body for name, body in reports
                  if name == theorem
              ]

              if len(matches) != 1:
                  raise SystemExit(
                      f"MISSING_AXIOM_REPORT: {theorem}"
                  )

              axioms = {
                  item.strip()
                  for item in matches[0].split(",")
                  if item.strip()
              }

              if not axioms <= allowed:
                  raise SystemExit(
                      f"UNEXPECTED_AXIOMS: {theorem}: "
                      f"{sorted(axioms - allowed)}"
                  )

              print(
                  "AUDITED:", theorem,
                  sorted(axioms)
              )

          if re.search(r"(?m)^.*error:", log):
              raise SystemExit("LEAN_ERROR_DETECTED")

          print("P84_R3_AXIOM_AUDIT_PASS")
          PY

      - name: Final checkpoint
        run: echo "P84_R3_VERIFIED"
