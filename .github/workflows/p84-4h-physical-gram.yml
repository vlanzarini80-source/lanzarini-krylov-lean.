
name: P84.4h Physical Gram Bridge

on:
  workflow_dispatch:
  push:
    branches:
      - research/p75-centered-derivative
    paths:
      - 'P84_4h_PhysicalGramBridge_Candidate.lean'
      - '.github/workflows/p84-4h-physical-gram.yml'

jobs:
  lean:
    name: Verify P84.4h in Lean 4
    runs-on: ubuntu-latest

    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4

      - name: Install elan
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Generate Lake manifest
        shell: bash
        run: |
          set -euo pipefail
          lake update
          test -f lake-manifest.json
          echo "LAKE_MANIFEST_READY"

      - name: Download Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          lake exe cache get

      - name: Audit source
        shell: bash
        run: |
          set -euo pipefail

          FILE="P84_4h_PhysicalGramBridge_Candidate.lean"
          test -f "$FILE"

          if grep -En '^[[:space:]]*(sorry|admit|axiom)([[:space:]]|$)' "$FILE"; then
            echo "FORBIDDEN_PROOF_SHORTCUT"
            exit 1
          fi

          if grep -En '^import .*P79' "$FILE"; then
            echo "FORBIDDEN_P79_IMPORT"
            exit 1
          fi

          echo "SOURCE_AUDIT_PASS"

      - name: Compile physical Gram bridge
        shell: bash
        run: |
          set -euo pipefail

          lake env lean P84_4h_PhysicalGramBridge_Candidate.lean \
            2>&1 | tee p84-4h.log

          echo "LEAN_COMPILATION_PASS"

      - name: Check printed axioms
        shell: bash
        run: |
          set -euo pipefail

          LOG="p84-4h.log"

          grep -q 'p84_4h_physical_gram_bridge' "$LOG"

          if grep -E 'sorryAx|Lean\.ofReduceBool' "$LOG"; then
            echo "UNEXPECTED_AXIOM"
            exit 1
          fi

          echo "PRELIMINARY_AXIOM_AUDIT_PASS"
          cat "$LOG"
