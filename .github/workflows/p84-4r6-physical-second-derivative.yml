name: P84.4r6 Physical Second Derivative Verification

on:
  push:
    branches:
      - research/p75-centered-derivative
    paths:
      - '**.lean'
      - 'lean-toolchain'
      - 'lakefile.toml'
      - 'lake-manifest.json'
      - '.github/workflows/p84-4r6-physical-second-derivative.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Lean
        shell: bash
        run: |
          set -euo pipefail

          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none

          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Initialize Lake
        shell: bash
        run: |
          set -euo pipefail

          lean --version

          if [ ! -f lake-manifest.json ]; then
            lake update
          fi

          test -f lake-manifest.json
          lake exe cache get

      - name: Compile physical second derivative
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import os
          import re
          import subprocess

          target = "P84_4r6_PhysicalSecondDerivative"

          root = Path.cwd()
          output = root / ".lake/build/lib/lean"
          output.mkdir(parents=True, exist_ok=True)

          visited = set()
          active = set()
          order = []

          def visit(module):

              if module in visited:
                  return

              if module in active:
                  raise RuntimeError(
                      f"CYCLIC_IMPORT: {module}"
                  )

              source = root / (
                  module.replace(".", "/") + ".lean"
              )

              if not source.is_file():
                  raise RuntimeError(
                      f"MISSING_SOURCE: {source}"
                  )

              active.add(module)

              for line in source.read_text(
                  encoding="utf-8"
              ).splitlines():

                  match = re.match(
                      r"^\s*import\s+(.+?)\s*$",
                      line
                  )

                  if match:
                      for dependency in match.group(1).split():

                          dep_source = root / (
                              dependency.replace(".", "/")
                              + ".lean"
                          )

                          if dep_source.is_file():
                              visit(dependency)

              active.remove(module)
              visited.add(module)
              order.append(module)

          visit(target)

          print("LOCAL_DEPENDENCY_ORDER:", flush=True)

          for module in order:
              print(module, flush=True)

          if any(
              module.startswith("P79")
              for module in order
          ):
              raise SystemExit(
                  "FORBIDDEN_P79_DEPENDENCY"
              )

          env = os.environ.copy()
          old = env.get("LEAN_PATH", "")

          env["LEAN_PATH"] = str(output) + (
              os.pathsep + old if old else ""
          )

          logs = []

          for module in order:

              source = root / (
                  module.replace(".", "/") + ".lean"
              )

              artifact = output / (
                  module.replace(".", "/") + ".olean"
              )

              artifact.parent.mkdir(
                  parents=True,
                  exist_ok=True
              )

              print("COMPILING:", module, flush=True)

              result = subprocess.run(
                  [
                      "lake", "env", "lean",
                      "-o", str(artifact),
                      str(source)
                  ],
                  env=env,
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT
              )

              print(result.stdout, flush=True)
              logs.append(result.stdout)

              Path("p84-r6.log").write_text(
                  "\n".join(logs),
                  encoding="utf-8"
              )

              if result.returncode != 0:
                  raise SystemExit(
                      f"LEAN_COMPILATION_FAILED: {module}"
                  )

              if not artifact.is_file():
                  raise SystemExit(
                      f"MISSING_OLEAN: {module}"
                  )

          print("P84_R6_COMPILATION_PASS")
          PY

      - name: Strict axiom audit
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          log = Path("p84-r6.log").read_text(
              encoding="utf-8"
          )

          expected = {
              "Lanzarini.p73_jacobiState_hasDerivAt",
              "Lanzarini.p84_4r5_velocity_hasDerivAt",
              "Lanzarini.p84_4r5_first_minor_derivative",
              "Lanzarini.p84_4r6_psi_hasDerivAt",
              "Lanzarini.p84_4r6_psi_derivative",
              "Lanzarini.p84_4r6_velocity_hasDerivAt",
              "Lanzarini.p84_4r6_psi_second_derivative"
          }

          allowed = {
              "propext",
              "Classical.choice",
              "Quot.sound"
          }

          reports = {}

          for name, body in re.findall(
              r"(?m)^'([^'\n]+)' depends on axioms:"
              r"\s*\[([^\]]*)\]",
              log
          ):

              axioms = {
                  item.strip()
                  for item in body.split(",")
                  if item.strip()
              }

              reports.setdefault(
                  name, []
              ).append(axioms)

          for name in re.findall(
              r"(?m)^'([^'\n]+)' does not depend on any axioms",
              log
          ):
              reports.setdefault(
                  name, []
              ).append(set())

          for theorem in sorted(expected):

              matches = reports.get(theorem, [])

              if len(matches) != 1:
                  raise SystemExit(
                      f"MISSING_OR_DUPLICATE_AXIOM_REPORT: {theorem}"
                  )

          for name, entries in reports.items():

              for axioms in entries:

                  unexpected = axioms - allowed

                  if unexpected:
                      raise SystemExit(
                          f"UNEXPECTED_AXIOMS: {name}: "
                          f"{sorted(unexpected)}"
                      )

                  print(
                      "AUDITED:",
                      name,
                      sorted(axioms)
                  )

          if re.search(r"(?m)^.*error:", log):
              raise SystemExit(
                  "LEAN_ERROR_DETECTED"
              )

          if re.search(r"(?m)^.*warning:.*sorry", log):
              raise SystemExit(
                  "SORRY_WARNING_DETECTED"
              )

          if "sorryAx" in log:
              raise SystemExit(
                  "SORRY_AXIOM_DETECTED"
              )

          print("P84_R6_AXIOM_AUDIT_PASS")
          PY

      - name: Upload verification log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p84-r6-verification-log
          path: p84-r6.log
          if-no-files-found: warn

      - name: Final checkpoint
        shell: bash
        run: |
          set -euo pipefail

          echo "P84_R6_COMPILATION_AND_AXIOM_AUDIT_PASS"
