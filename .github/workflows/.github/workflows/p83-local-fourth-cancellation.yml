
name: P83 Local Fourth Cancellation

on:
  push:
    paths:
      - 'P83_LocalFourthCancellation_Candidate.lean'
      - '.github/workflows/p83-local-fourth-cancellation.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lean
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Install mathlib cache
        run: |
          set -euo pipefail
          lake update
          lake exe cache get

      - name: Compile dependencies
        run: |
          set -euo pipefail
          for mod in P83_LeibnizSecond_Candidate P83_LeibnizLocal_Candidate; do
            LEAN_PATH=".:${LEAN_PATH:-}" lake env lean \
              -o "$mod.olean" "$mod.lean"
          done

      - name: Compile and audit fourth cancellation
        run: |
          set -euo pipefail
          LEAN_PATH=".:${LEAN_PATH:-}" lake env lean \
            P83_LocalFourthCancellation_Candidate.lean \
            2>&1 | tee p83-fourth-cancellation.log

          if grep -Eq 'sorryAx|error:' p83-fourth-cancellation.log; then
            exit 1
          fi

          grep -F \
            "'Lanzarini.p83_local_fourth_product_zero' depends on axioms:" \
            p83-fourth-cancellation.log

          python3 - <<'PY'
          from pathlib import Path
          import re

          src = Path(
              "P83_LocalFourthCancellation_Candidate.lean"
          ).read_text()
          log = Path(
              "p83-fourth-cancellation.log"
          ).read_text()

          assert not re.search(
              r"\b(sorry|admit|axiom|sorryAx)\b",
              src
          ), "Forbidden proof placeholder"

          prefix = (
              "'Lanzarini.p83_local_fourth_product_zero'"
              " depends on axioms:"
          )
          matches = [
              line.strip()
              for line in log.splitlines()
              if line.strip().startswith(prefix)
          ]
          assert len(matches) == 1, "Missing axiom report"

          payload = matches[0][len(prefix):].strip()
          assert payload.startswith("[") and payload.endswith("]")

          found = {
              x.strip()
              for x in payload[1:-1].split(",")
              if x.strip()
          }
          allowed = {
              "propext",
              "Classical.choice",
              "Quot.sound",
          }
          assert found <= allowed, f"Unexpected axioms: {found - allowed}"
          print("PASS: local fourth cancellation audited")
          PY
