
name: P83 Leibniz Isolated Verification

on:
  push:
  workflow_dispatch:

jobs:
  verify-leibniz:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Lean 4
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch mathlib dependencies
        run: |
          set -euo pipefail
          lake update
          lake exe cache get

      - name: Compile second and third order
        run: |
          set -euo pipefail
          LEAN_PATH=".:${LEAN_PATH:-}" lake env lean \
            -o P83_LeibnizSecond_Candidate.olean \
            P83_LeibnizSecond_Candidate.lean \
            2>&1 | tee p83-second-third.log

      - name: Compile fourth order
        run: |
          set -euo pipefail
          test -f P83_LeibnizSecond_Candidate.olean
          LEAN_PATH=".:${LEAN_PATH:-}" lake env lean \
            -o P83_LeibnizFourth_Candidate.olean \
            P83_LeibnizFourth_Candidate.lean \
            2>&1 | tee p83-fourth.log

      - name: Compile local differentiability candidate
        run: |
          set -euo pipefail
          test -f P83_LeibnizSecond_Candidate.olean
          test -f P83_LeibnizLocal_Candidate.lean
          LEAN_PATH=".:${LEAN_PATH:-}" lake env lean \
            P83_LeibnizLocal_Candidate.lean \
            2>&1 | tee p83-local.log
          if grep -Eq 'sorryAx|error:' p83-local.log; then
            exit 1
          fi

      - name: Audit local candidate source
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("P83_LeibnizLocal_Candidate.lean")
          source = path.read_text(encoding="utf-8")

          forbidden = re.compile(
              r"(?m)^\s*(?:sorry|admit|axiom)\b"
              r"|\bby\s+(?:sorry|admit)\b"
              r"|\bsorryAx\b"
          )

          if forbidden.search(source):
              raise SystemExit(
                  "FAIL: forbidden proof token in local candidate"
              )

          for name in (
              "p83_local_diff_iterated",
              "p83_local_eventually_diff",
          ):
              pattern = re.compile(
                  r"\b(?:private\s+)?theorem\s+"
                  + re.escape(name)
                  + r"\b"
              )
              if len(pattern.findall(source)) != 1:
                  raise SystemExit(
                      f"FAIL: missing or duplicate theorem {name}"
                  )

          print(
              "PASS: local candidate source checks"
          )
          PY

      - name: Audit all three theorems
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          expected = {
              "P83_LeibnizSecond_Candidate": (
                  "p83_leibniz_second",
                  "p83_leibniz_third",
              ),
              "P83_LeibnizFourth_Candidate": (
                  "p83_leibniz_fourth",
              ),
          }

          allowed = {
              "propext",
              "Classical.choice",
              "Quot.sound",
          }

          forbidden_source = re.compile(
              r"(?m)^\s*(?:sorry|admit|axiom)\b"
              r"|\bby\s+(?:sorry|admit)\b"
              r"|\bsorryAx\b"
          )

          for module, names in expected.items():
              source = Path(module + ".lean").read_text(
                  encoding="utf-8"
              )

              log_name = (
                  "p83-fourth.log"
                  if module == "P83_LeibnizFourth_Candidate"
                  else "p83-second-third.log"
              )

              log = Path(log_name).read_text(
                  encoding="utf-8"
              )

              if forbidden_source.search(source):
                  raise SystemExit(
                      f"FAIL: forbidden proof token in {module}"
                  )

              if "sorryAx" in log:
                  raise SystemExit(
                      f"FAIL: sorryAx in {module}"
                  )

              for name in names:
                  declaration = re.compile(
                      r"\btheorem\s+"
                      + re.escape(name)
                      + r"\b"
                  )

                  if len(declaration.findall(source)) != 1:
                      raise SystemExit(
                          f"FAIL: theorem missing: {name}"
                      )

                  if source.count(
                      "#print axioms " + name
                  ) != 1:
                      raise SystemExit(
                          f"FAIL: axiom print missing: {name}"
                      )

                  prefix = (
                      f"'Lanzarini.{name}'"
                      " depends on axioms:"
                  )

                  matches = [
                      line.strip()
                      for line in log.splitlines()
                      if line.strip().startswith(prefix)
                  ]

                  if len(matches) != 1:
                      raise SystemExit(
                          f"FAIL: axiom report missing: {name}"
                      )

                  payload = matches[0][len(prefix):].strip()

                  if not (
                      payload.startswith("[")
                      and payload.endswith("]")
                  ):
                      raise SystemExit(
                          f"FAIL: invalid axiom list: {name}"
                      )

                  found = {
                      item.strip()
                      for item in payload[1:-1].split(",")
                      if item.strip()
                  }

                  unexpected = found - allowed

                  if unexpected:
                      raise SystemExit(
                          f"FAIL: unauthorized axioms for "
                          f"{name}: {sorted(unexpected)}"
                      )

                  print(
                      f"PASS {name}: {sorted(found)}"
                  )

          print(
              "PASS: Leibniz orders 2, 3 and 4 "
              "compiled and individually audited"
          )
          PY
