
name: P83 Leibniz Isolated Verification

on:
  push:
  workflow_dispatch:

jobs:
  verify-leibniz:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Lean 4
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch mathlib dependencies
        run: |
          lake update
          lake exe cache get

      - name: Compile P83 auxiliary lemma
        run: |
          set -euo pipefail
          lake env lean P83_LeibnizSecond_Candidate.lean 2>&1 | tee p83-leibniz.log

      - name: Audit theorem axioms
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          log = Path("p83-leibniz.log").read_text()
          prefix = (
              "'Lanzarini.p83_leibniz_second'"
              " depends on axioms:"
          )

          matches = [
              line.strip()
              for line in log.splitlines()
              if line.strip().startswith(prefix)
          ]

          if len(matches) != 1:
              raise SystemExit(
                  "FAIL: theorem axiom report missing"
              )

          payload = matches[0][len(prefix):].strip()

          if not (
              payload.startswith("[")
              and payload.endswith("]")
          ):
              raise SystemExit(
                  "FAIL: invalid axiom report"
              )

          allowed = {
              "propext",
              "Classical.choice",
              "Quot.sound",
          }

          found = {
              item.strip()
              for item in payload[1:-1].split(",")
              if item.strip()
          }

          unexpected = found - allowed

          if unexpected:
              raise SystemExit(
                  f"FAIL: unauthorized axioms: {unexpected}"
              )

          if "sorryAx" in log:
              raise SystemExit(
                  "FAIL: sorryAx found in compiler output"
              )

          print(
              "PASS: p83_leibniz_second "
              "compiled with permitted axioms only"
          )
          PY
